<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Refacciones Automotrices | Fichas Técnicas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .badge-matched {
      background-color: #fef08a !important;
      border-left: 4px solid #ca8a04 !important;
      color: #713f12 !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white font-black text-xl shadow-md">
          <i class="fa-solid fa-car-battery"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Catálogo de Autopartes & Fichas Técnicas</h1>
          <p class="text-xs text-slate-400">Buscador Inteligente de Mostrador y Descarga de Especificaciones</p>
        </div>
      </div>
      <div id="contador-productos" class="text-xs bg-red-950 text-red-300 font-bold px-3 py-1.5 rounded-full border border-red-800">
        Cargando refacciones...
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- Panel de Filtros -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        <h2 class="font-bold text-slate-800 text-base sm:text-lg flex items-center gap-2">
          <i class="fa-solid fa-sliders text-red-600"></i> Filtros de Búsqueda
        </h2>
        <button onclick="limpiarFiltros()" class="text-xs text-slate-500 hover:text-red-600 font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i> Restablecer filtros
        </button>
      </div>

      <!-- Barra de Búsqueda Libre -->
      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">
          Búsqueda rápida por código, modelo o referencia cruzada:
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input type="text" id="input-busqueda" oninput="aplicarFiltros()" placeholder="Ejemplo: FILS87, Silverado, DG508, Expedition, BOUF226..." class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-300 focus:border-red-500 focus:ring-2 focus:ring-red-100 text-sm outline-none transition bg-slate-50/50 focus:bg-white">
          <button id="btn-borrar" onclick="limpiarTexto()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Botones de Prueba Rápida -->
      <div class="flex flex-wrap items-center gap-1.5 mb-4 text-xs">
        <span class="text-slate-400 font-medium mr-1">Pruebas rápidas:</span>
        <button onclick="buscarTermino('FILS87')" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-700 font-semibold rounded-lg border border-red-200 transition">
          FILS87
        </button>
        <button onclick="buscarTermino('Silverado')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition">
          Silverado
        </button>
        <button onclick="buscarTermino('DG508')" class="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold rounded-lg border border-emerald-200 transition">
          DG508
        </button>
        <button onclick="buscarTermino('BOUF226')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold rounded-lg border border-blue-200 transition">
          BOUF226
        </button>
      </div>

      <!-- Filtros Cascada -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">1. Marca</label>
          <select id="select-marca" onchange="alCambiarMarca()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium outline-none">
            <option value="" selected>Todas las marcas</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">2. Modelo</label>
          <select id="select-modelo" onchange="alCambiarModelo()" disabled class="w-full bg-slate-100 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium outline-none disabled:opacity-50">
            <option value="">Todos los modelos</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">3. Año</label>
          <select id="select-ano" onchange="aplicarFiltros()" disabled class="w-full bg-slate-100 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium outline-none disabled:opacity-50">
            <option value="">Todos los años</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">4. Motor</label>
          <select id="select-motor" onchange="aplicarFiltros()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium outline-none">
            <option value="">Cualquier motor</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Contador de Resultados -->
    <div class="flex justify-between items-center mb-4">
      <div class="text-sm text-slate-700 font-medium">
        Resultados: <span id="contador-resultados" class="font-black text-red-600 text-base">0</span> piezas encontradas
      </div>
    </div>

    <!-- Grid de Tarjetas -->
    <div id="grid-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Modal Ficha Técnica en Pantalla -->
  <div id="modal-ficha" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[92vh] overflow-y-auto shadow-2xl border border-slate-100 flex flex-col">
      <div class="sticky top-0 bg-white px-6 py-4 border-b border-slate-100 flex justify-between items-center z-10">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-red-600">Ficha Técnica Oficial</span>
          <h3 id="modal-codigo" class="text-2xl font-black text-slate-900"></h3>
        </div>
        <div class="flex items-center gap-2">
          <button id="modal-btn-pdf" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg shadow flex items-center gap-1.5">
            <i class="fa-solid fa-file-pdf"></i> Descargar PDF
          </button>
          <button onclick="cerrarModalFicha()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div id="modal-cuerpo" class="p-6"></div>
    </div>
  </div>

  <script>
    let catalogo = [];

    fetch('catalogo_completo.json')
      .then(res => res.json())
      .then(data => {
        catalogo = data;
        document.getElementById('contador-productos').textContent = `${catalogo.length} Piezas en Catálogo`;
        inicializarFiltros();
        aplicarFiltros();
      })
      .catch(err => {
        document.getElementById('contador-productos').textContent = "Error cargando archivo JSON";
        console.error("Error al cargar catalogo_completo.json", err);
      });

    function normalizar(txt) {
      return (txt || '').toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function inicializarFiltros() {
      const marcas = [...new Set(catalogo.flatMap(i => i.aplicaciones.map(a => a.marca)).filter(Boolean))].sort();
      const selectMarca = document.getElementById('select-marca');
      selectMarca.innerHTML = '<option value="" selected>Todas las marcas</option>';
      marcas.forEach(m => selectMarca.innerHTML += `<option value="${m}">${m}</option>`);

      const motores = [...new Set(catalogo.flatMap(i => i.aplicaciones.map(a => a.motor)).filter(Boolean))].sort();
      const selectMotor = document.getElementById('select-motor');
      selectMotor.innerHTML = '<option value="" selected>Cualquier motor</option>';
      motores.forEach(mot => selectMotor.innerHTML += `<option value="${mot}">${mot}</option>`);
    }

    function alCambiarMarca() {
      const marca = document.getElementById('select-marca').value;
      const selectModelo = document.getElementById('select-modelo');
      selectModelo.innerHTML = '<option value="">Todos los modelos</option>';

      if (marca) {
        selectModelo.disabled = false;
        selectModelo.classList.remove('bg-slate-100');
        const modelos = [...new Set(catalogo.flatMap(i => i.aplicaciones.filter(a => normalizar(a.marca) === normalizar(marca)).map(a => a.modelo)))].sort();
        modelos.forEach(m => selectModelo.innerHTML += `<option value="${m}">${m}</option>`);
      } else {
        selectModelo.disabled = true;
        selectModelo.classList.add('bg-slate-100');
      }
      alCambiarModelo();
    }

    function alCambiarModelo() {
      const marca = document.getElementById('select-marca').value;
      const modelo = document.getElementById('select-modelo').value;
      const selectAno = document.getElementById('select-ano');
      selectAno.innerHTML = '<option value="">Todos los años</option>';

      if (marca || modelo) {
        selectAno.disabled = false;
        selectAno.classList.remove('bg-slate-100');
        const anos = new Set();
        catalogo.forEach(item => {
          item.aplicaciones.forEach(app => {
            const mMarca = !marca || normalizar(app.marca) === normalizar(marca);
            const mMod = !modelo || normalizar(app.modelo) === normalizar(modelo);
            if (mMarca && mMod && app.ano_inicio) {
              for (let a = app.ano_inicio; a <= (app.ano_fin || app.ano_inicio); a++) anos.add(a);
            }
          });
        });
        [...anos].sort((a,b) => b - a).forEach(a => selectAno.innerHTML += `<option value="${a}">${a}</option>`);
      } else {
        selectAno.disabled = true;
        selectAno.classList.add('bg-slate-100');
      }
      aplicarFiltros();
    }

    function coincideAno(app, anoBuscado) {
      if (!anoBuscado) return true;
      let ano = parseInt(anoBuscado);
      if (ano < 100) ano = ano >= 50 ? 1900 + ano : 2000 + ano;
      return ano >= app.ano_inicio && ano <= (app.ano_fin || app.ano_inicio);
    }

    function aplicarFiltros() {
      let rawText = document.getElementById('input-busqueda').value.replace(/["']/g, '');
      const btnBorrar = document.getElementById('btn-borrar');
      if (rawText.trim().length > 0) btnBorrar.classList.remove('hidden');
      else btnBorrar.classList.add('hidden');

      const texto = normalizar(rawText);
      const marca = document.getElementById('select-marca').value;
      const modelo = document.getElementById('select-modelo').value;
      const ano = document.getElementById('select-ano').value;
      const motor = document.getElementById('select-motor').value;

      const palabras = texto.split(/[\s,.-]+/).filter(Boolean);
      let anoDesdeTexto = null;
      const palabrasResto = [];

      palabras.forEach(p => {
        const num = parseInt(p);
        if (!isNaN(num) && ((num >= 1970 && num <= 2035) || (num >= 70 && num <= 99) || (num >= 0 && num <= 35 && p.length === 2))) {
          anoDesdeTexto = num < 100 ? (num >= 50 ? 1900 + num : 2000 + num) : num;
        } else {
          palabrasResto.push(p);
        }
      });

      const anoEfectivo = ano || anoDesdeTexto;

      const filtrados = catalogo.filter(item => {
        if (motor && !item.aplicaciones.some(a => a.motor === motor)) return false;

        const coincideVehiculo = item.aplicaciones.some(a => {
          const mMarca = !marca || normalizar(a.marca) === normalizar(marca);
          const mMod = !modelo || normalizar(a.modelo) === normalizar(modelo);
          const mAno = coincideAno(a, anoEfectivo);
          return mMarca && mMod && mAno;
        });
        if (!coincideVehiculo) return false;

        if (palabrasResto.length > 0) {
          const refs = (item.referencias_cruzadas || []).join(' ');
          const full = normalizar(`${item.codigo} ${item.tipo} ${item.sistema} ${refs} ${item.aplicaciones.map(a => `${a.marca} ${a.modelo} ${a.motor}`).join(' ')}`);
          if (!palabrasResto.every(pal => full.includes(pal))) return false;
        }
        return true;
      });

      renderizar(filtrados.slice(0, 60), { marca, modelo, ano: anoEfectivo, total: filtrados.length });
    }

    function renderizar(lista, f) {
      const cont = document.getElementById('grid-productos');
      document.getElementById('contador-resultados').textContent = f.total;

      if (lista.length === 0) {
        cont.innerHTML = `
          <div class="col-span-full bg-white p-10 text-center rounded-2xl border border-slate-200">
            <p class="text-slate-500 text-sm">No se encontraron refacciones con ese filtro.</p>
            <button onclick="limpiarFiltros()" class="mt-3 px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-bold">Ver catálogo completo</button>
          </div>
        `;
        return;
      }

      cont.innerHTML = lista.map(item => {
        const appsRows = item.aplicaciones.map(a => {
          const match = (f.marca && normalizar(a.marca) === normalizar(f.marca)) ||
                        (f.modelo && normalizar(a.modelo) === normalizar(f.modelo)) ||
                        (f.ano && coincideAno(a, f.ano));
          return `
            <tr class="${match ? 'badge-matched' : 'hover:bg-slate-50'} text-xs border-b">
              <td class="py-1 px-2 font-medium">${a.marca}</td>
              <td class="py-1 px-2 font-bold">${a.modelo}</td>
              <td class="py-1 px-2 font-mono">${a.anos_texto}</td>
              <td class="py-1 px-2 text-slate-600">${a.motor || '-'} ${a.cilindros ? '('+a.cilindros+')' : ''}</td>
            </tr>
          `;
        }).join('');

        const refsBadges = (item.referencias_cruzadas || []).map(r => 
          `<span class="inline-block bg-slate-100 border border-slate-200 text-slate-700 text-[10px] font-semibold px-2 py-0.5 rounded-md mr-1 mb-1"><i class="fa-solid fa-code-compare text-red-500 mr-1"></i>${r}</span>`
        ).join('');

        return `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <!-- Cabecera Tarjeta -->
            <div class="p-4 bg-slate-900 text-white flex justify-between items-start gap-2">
              <div class="flex-1">
                <span class="text-[10px] font-bold uppercase text-red-400 block line-clamp-1">${item.sistema || item.marca}</span>
                <h3 class="text-2xl font-black">${item.codigo}</h3>
                <p class="text-xs text-slate-300 line-clamp-2">${item.tipo}</p>
              </div>
              ${item.imagen ? `<img src="${item.imagen}" class="w-16 h-16 object-contain bg-white rounded-xl p-1 shadow-inner" onerror="this.style.display='none'">` : ''}
            </div>

            ${refsBadges ? `<div class="p-2.5 bg-slate-50 border-b flex flex-wrap items-center">${refsBadges}</div>` : ''}

            <!-- Tabla de Aplicaciones -->
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="overflow-x-auto max-h-40 border rounded-xl mb-3">
                  <table class="w-full text-left">
                    <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 sticky top-0">
                      <tr><th class="p-1.5">Marca</th><th class="p-1.5">Modelo</th><th class="p-1.5">Años</th><th class="p-1.5">Motor</th></tr>
                    </thead>
                    <tbody>${appsRows}</tbody>
                  </table>
                </div>
              </div>

              <!-- Botones de Acción -->
              <div class="pt-3 border-t space-y-2">
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="verFichaTecnica('${item.codigo}')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-eye"></i> Ver Ficha
                  </button>
                  <button onclick="descargarFichaPDF('${item.codigo}')" class="px-3 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1 shadow-sm">
                    <i class="fa-solid fa-file-pdf"></i> Bajar Ficha (PDF)
                  </button>
                </div>
                <div class="flex gap-2">
                  <button onclick="navigator.clipboard.writeText('${item.codigo}'); alert('Código copiado: ${item.codigo}')" class="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 text-[11px] font-semibold rounded-xl border border-slate-200 flex-1">
                    Copiar Código
                  </button>
                  <button onclick="window.open('https://wa.me/?text='+encodeURIComponent('Hola, requiero cotización de la refacción con código *${item.codigo}* (${item.tipo})'), '_blank')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-xl flex items-center gap-1">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal para ver Ficha en Pantalla
    function verFichaTecnica(codigo) {
      const item = catalogo.find(p => p.codigo === codigo);
      if (!item) return;

      document.getElementById('modal-codigo').textContent = item.codigo;
      document.getElementById('modal-btn-pdf').onclick = () => descargarFichaPDF(codigo);

      const cuerpo = document.getElementById('modal-cuerpo');
      const appsFilas = item.aplicaciones.map(a => `
        <tr class="border-b">
          <td class="py-2 px-3 font-medium">${a.marca}</td>
          <td class="py-2 px-3 font-bold">${a.modelo}</td>
          <td class="py-2 px-3 font-mono">${a.anos_texto}</td>
          <td class="py-2 px-3">${a.motor || '-'} ${a.cilindros ? '('+a.cilindros+')' : ''}</td>
        </tr>
      `).join('');

      cuerpo.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row gap-4 items-center bg-slate-50 p-4 rounded-xl border">
            ${item.imagen ? `<img src="${item.imagen}" class="w-32 h-32 object-contain bg-white rounded-xl border p-2 shadow-sm">` : ''}
            <div class="flex-1 text-center sm:text-left">
              <span class="text-xs uppercase font-bold text-red-600">${item.sistema}</span>
              <h4 class="text-xl font-black text-slate-900">${item.tipo}</h4>
              <p class="text-xs text-slate-600 mt-1">Marca / Línea: <strong>${item.marca}</strong></p>
            </div>
          </div>

          ${(item.referencias_cruzadas && item.referencias_cruzadas.length) ? `
            <div class="bg-amber-50/70 border border-amber-200 p-3 rounded-xl text-xs">
              <strong class="text-amber-900 block mb-1">Referencias Cruzadas / Equivalencias:</strong>
              <div class="flex flex-wrap gap-1">
                ${item.referencias_cruzadas.map(r => `<span class="bg-white border border-amber-200 px-2 py-0.5 rounded font-mono">${r}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          <div>
            <h5 class="text-xs font-bold text-slate-700 uppercase mb-2">Vehículos y Aplicaciones Compatibles:</h5>
            <div class="border rounded-xl overflow-hidden max-h-56 overflow-y-auto">
              <table class="w-full text-xs text-left">
                <thead class="bg-slate-100 text-slate-600 uppercase font-bold sticky top-0">
                  <tr><th class="p-2">Marca</th><th class="p-2">Modelo</th><th class="p-2">Años</th><th class="p-2">Motor</th></tr>
                </thead>
                <tbody>${appsFilas}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('modal-ficha').classList.remove('hidden');
    }

    function cerrarModalFicha() {
      document.getElementById('modal-ficha').classList.add('hidden');
    }

    // Generador de Ficha Técnica Imprimible / Descargable en PDF
    function descargarFichaPDF(codigo) {
      const item = catalogo.find(p => p.codigo === codigo);
      if (!item) return;

      const tablaHTML = item.aplicaciones.map(a => `
        <tr style="border-bottom: 1px solid #e2e8f0; font-size: 11px;">
          <td style="padding: 6px 8px; font-weight: 500;">${a.marca}</td>
          <td style="padding: 6px 8px; font-weight: bold;">${a.modelo}</td>
          <td style="padding: 6px 8px; font-family: monospace;">${a.anos_texto}</td>
          <td style="padding: 6px 8px;">${a.motor || '-'} ${a.cilindros ? '('+a.cilindros+')' : ''}</td>
        </tr>
      `).join('');

      const refsHTML = (item.referencias_cruzadas || []).map(r => 
        `<span style="display:inline-block; background:#f1f5f9; border:1px solid #cbd5e1; padding:2px 8px; border-radius:4px; font-size:11px; margin:2px;">${r}</span>`
      ).join(' ');

      const ventana = window.open('', '_blank');
      ventana.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <title>Ficha Técnica - ${item.codigo}</title>
          <style>
            @media print {
              body { margin: 0; padding: 15mm; }
              .no-print { display: none; }
            }
            body { font-family: Arial, sans-serif; color: #1e293b; padding: 20px; max-width: 800px; margin: auto; }
            .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #dc2626; padding-bottom: 10px; margin-bottom: 20px; }
            .badge { background: #dc2626; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
            .codigo { font-size: 28px; font-weight: 900; margin: 5px 0; color: #0f172a; }
            .product-box { display: flex; gap: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
            .product-img { width: 140px; height: 140px; object-fit: contain; background: white; border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px; }
            table { width: 100%; border-collapse: collapse; text-align: left; }
            th { background: #f1f5f9; padding: 8px; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; }
            .btn-imprimir { background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
          </style>
        </head>
        <body>
          <div class="no-print" style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; padding: 10px 15px; border-radius: 8px;">
            <span>Vista previa de Ficha Técnica</span>
            <button class="btn-imprimir" onclick="window.print()">Guardar como PDF / Imprimir</button>
          </div>

          <div class="header">
            <div>
              <span class="badge">FICHA TÉCNICA OFICIAL</span>
              <h1 class="codigo">${item.codigo}</h1>
              <p style="margin: 0; font-size: 13px; color: #64748b;">${item.sistema || 'SISTEMA AUTOMOTRIZ'}</p>
            </div>
            <div style="text-align: right; font-size: 12px; color: #64748b;">
              <strong>Refaccionaria & Autopartes</strong><br>
              Línea: ${item.marca}
            </div>
          </div>

          <div class="product-box">
            ${item.imagen ? `<img src="${item.imagen}" class="product-img" onerror="this.style.display='none'">` : ''}
            <div style="flex: 1;">
              <h2 style="font-size: 16px; margin-top: 0; color: #0f172a;">${item.tipo}</h2>
              <p style="font-size: 12px; margin: 4px 0;"><strong>Línea / Fabricante:</strong> ${item.marca}</p>
              ${refsHTML ? `
                <div style="margin-top: 10px;">
                  <strong style="font-size: 11px; display: block; margin-bottom: 4px;">Referencias Cruzadas / Códigos Equivalentes:</strong>
                  ${refsHTML}
                </div>
              ` : ''}
            </div>
          </div>

          <h3 style="font-size: 13px; text-transform: uppercase; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 8px;">Tabla de Aplicaciones y Vehículos Compatibles</h3>
          <table>
            <thead>
              <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Años</th>
                <th>Motor / Cilindros</th>
              </tr>
            </thead>
            <tbody>
              ${tablaHTML}
            </tbody>
          </table>

          <div style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 10px; font-size: 10px; color: #94a3b8; text-align: center;">
            Documento de especificación técnica automotriz &bull; Catálogo de Refacciones
          </div>

          <script>
            // Abre el cuadro de diálogo para Guardar como PDF automáticamente
            window.onload = function() {
              setTimeout(() => { window.print(); }, 400);
            };
          <\/script>
        </body>
        </html>
      `);
      ventana.document.close();
    }

    function buscarTermino(term) {
      document.getElementById('input-busqueda').value = term;
      document.getElementById('select-marca').value = '';
      document.getElementById('select-motor').value = '';
      alCambiarMarca();
      aplicarFiltros();
    }

    function limpiarTexto() {
      document.getElementById('input-busqueda').value = '';
      aplicarFiltros();
    }

    function limpiarFiltros() {
      document.getElementById('input-busqueda').value = '';
      document.getElementById('select-marca').value = '';
      document.getElementById('select-motor').value = '';
      alCambiarMarca();
    }
  </script>
</body>
</html>
